<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kitchen — Toast Express</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍🍳</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-in" style="width:min(980px,100% - 28px)">
    <a class="logo" href="index.html">Toast<b>Express</b> <span class="st st-done hide-s" style="margin-left:6px">Kitchen</span></a>
    <div style="display:flex;gap:8px;align-items:center">
      <a class="btn btn-ghost btn-sm" href="app.html">Shop view</a>
      <button class="btn btn-ink btn-sm" id="logoutBtn" type="button">Log out</button>
    </div>
  </div>
</header>

<main class="admin" id="main">
  <!-- numbers + the 2 controls you use every morning -->
  <section class="tiles">
    <div class="tile dark">
      <small>Today's stock</small>
      <b id="tTotal">–</b>
      <div class="stock-edit"><input id="stockInput" type="number" min="0" max="500" inputmode="numeric" aria-label="Toasts available today"><button class="btn btn-orange btn-sm" id="stockSave" type="button">Set</button></div>
    </div>
    <div class="tile"><small>Left to sell</small><b id="tLeft">–</b><span class="hint" id="tSold">–</span></div>
    <div class="tile"><small>Money confirmed</small><b id="tMoney">–</b><span class="hint" id="tPending">–</span></div>
    <div class="tile"><small>Taking orders?</small>
      <label class="switch"><input type="checkbox" id="acceptSwitch"><span id="acceptLabel">–</span></label></div>
  </section>

  <details class="settings">
    <summary>Settings: price, bank details, description <span>▾</span></summary>
    <form id="settingsForm" novalidate>
      <div class="grid2">
        <div class="field"><label for="sPrice">Price per toast (₦)</label><input id="sPrice" type="number" min="0" inputmode="numeric"></div>
        <div class="field"><label for="sBank">Bank name</label><input id="sBank" maxlength="40"></div>
        <div class="field"><label for="sAcct">Account number</label><input id="sAcct" inputmode="numeric" maxlength="20"></div>
        <div class="field"><label for="sAname">Account name</label><input id="sAname" maxlength="60"></div>
      </div>
      <div class="field"><label for="sIng">What's in the toast (shown to customers)</label><input id="sIng" maxlength="220"></div>
      <button class="btn btn-ink" type="submit">Save settings</button>
    </form>
  </details>

  <section>
    <div class="tabs" id="tabs" role="tablist"></div>
  </section>
  <section class="olist" id="olist" aria-live="polite"></section>

  <section>
    <div class="section-title" style="margin:24px 0 12px"><h2 style="font-size:1.7rem">Reviews <span class="hint" id="rvAdminCount"></span></h2>
      <p class="hint">Students' reviews show on the home page. Hide any you don't want public.</p></div>
    <div class="olist" id="rlist"></div>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
